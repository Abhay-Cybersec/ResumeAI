<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeAI – Smart Resume Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                        },
                        secondary: {
                            500: '#10b981',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .text-input {
            font-family: 'Inter', sans-serif;
            min-height: 200px;
            max-height: 400px;
        }
        .result-box {
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-gray-100 min-h-screen flex flex-col">
    <header class="py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-5xl mx-auto text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-500 rounded-2xl mb-4 shadow-lg shadow-primary-500/50">
                <i data-feather="file-text" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-5xl sm:text-6xl font-bold bg-gradient-to-r from-primary-400 to-purple-500 bg-clip-text text-transparent mb-3">
                ResumeAI
            </h1>
            <p class="text-xl text-gray-400">Your AI-powered resume optimization assistant</p>
        </div>
    </header>

    <main class="flex-grow px-4 sm:px-6 lg:px-8 pb-12">
        <div class="max-w-5xl mx-auto">
            <div class="grid md:grid-cols-2 gap-6 mb-6">
                <!-- Resume Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2 flex items-center">
                        <i data-feather="file" class="w-4 h-4 mr-2"></i>
                        Your Resume Text *
                    </label>
                    <textarea 
                        id="resumeInput" 
                        class="text-input w-full bg-gray-800 border-2 border-gray-700 hover:border-primary-500 rounded-xl p-5 text-gray-200 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent resize-y transition duration-200" 
                        placeholder="Paste your resume text here...&#10;&#10;Example:&#10;Software Engineer with 3 years experience in Python, React, and AWS..."
                    ></textarea>
                    <div class="text-xs text-gray-500 mt-2" id="resumeCharCount">0 characters</div>
                </div>

                <!-- Job Description Input (Optional) -->
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2 flex items-center">
                        <i data-feather="briefcase" class="w-4 h-4 mr-2"></i>
                        Job Description (Optional)
                    </label>
                    <textarea 
                        id="jobInput" 
                        class="text-input w-full bg-gray-800 border-2 border-gray-700 hover:border-primary-500 rounded-xl p-5 text-gray-200 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent resize-y transition duration-200" 
                        placeholder="Paste the job description here for match analysis...&#10;&#10;Example:&#10;Looking for a Software Engineer with Python, Docker, Kubernetes..."
                    ></textarea>
                    <div class="text-xs text-gray-500 mt-2" id="jobCharCount">0 characters</div>
                </div>
            </div>

            <div class="text-center mb-10">
                <button id="analyzeBtn" class="group bg-gradient-to-r from-primary-500 to-purple-600 hover:from-primary-600 hover:to-purple-700 text-white font-semibold py-4 px-10 rounded-xl transition duration-200 flex items-center justify-center mx-auto shadow-lg shadow-primary-500/50 hover:shadow-primary-600/60 transform hover:scale-105">
                    <i data-feather="zap" class="mr-2 w-5 h-5"></i>
                    <span>Analyze Resume</span>
                    <i data-feather="arrow-right" class="ml-2 w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>

            <div id="resultContainer" class="hidden result-box bg-gray-800 border-2 border-gray-700 rounded-2xl p-8 shadow-2xl">
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-700">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-primary-500/20 rounded-lg flex items-center justify-center mr-3">
                            <i data-feather="check-circle" class="w-5 h-5 text-primary-500"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-100">Analysis Results</h3>
                    </div>
                    <button id="copyBtn" class="flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-secondary-500 text-gray-300 hover:text-white rounded-lg transition duration-200 group">
                        <i data-feather="copy" class="w-4 h-4"></i>
                        <span class="text-sm font-medium">Copy</span>
                    </button>
                </div>
                <div id="resultContent" class="text-gray-300 whitespace-pre-wrap leading-relaxed text-base bg-gray-900/50 rounded-xl p-6 border border-gray-700"></div>
            </div>

            <div id="loadingIndicator" class="hidden text-center py-8">
                <div class="inline-flex items-center justify-center space-x-2">
                    <div class="w-3 h-3 bg-primary-500 rounded-full animate-bounce"></div>
                    <div class="w-3 h-3 bg-primary-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                    <div class="w-3 h-3 bg-primary-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                </div>
                <p class="text-gray-400 mt-4 text-sm">AI is analyzing your resume...</p>
            </div>
        </div>
    </main>

    <footer class="py-8 px-4 sm:px-6 lg:px-8 bg-gray-900/50 border-t border-gray-800">
        <div class="max-w-5xl mx-auto text-center">
            <div class="flex items-center justify-center space-x-2 text-gray-400 mb-2">
                <i data-feather="heart" class="w-4 h-4 text-red-500"></i>
                <p>Built with passion by <span class="text-primary-400 font-semibold">Abhay Aggarwal</span></p>
            </div>
            <p class="text-xs text-gray-500">Powered by Google FLAN-T5 via HuggingFace Transformers</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            feather.replace();
            
            const analyzeBtn = document.getElementById('analyzeBtn');
            const resumeInput = document.getElementById('resumeInput');
            const jobInput = document.getElementById('jobInput');
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');
            const copyBtn = document.getElementById('copyBtn');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resumeCharCount = document.getElementById('resumeCharCount');
            const jobCharCount = document.getElementById('jobCharCount');

            resumeInput.addEventListener('input', () => {
                resumeCharCount.textContent = `${resumeInput.value.length} characters`;
            });

            jobInput.addEventListener('input', () => {
                jobCharCount.textContent = `${jobInput.value.length} characters`;
            });

            analyzeBtn.addEventListener('click', async function() {
                const resume = resumeInput.value.trim();
                const jobDescription = jobInput.value.trim();
                
                if (!resume) {
                    alert('⚠️ Please paste your resume text');
                    resumeInput.focus();
                    return;
                }
                
                analyzeBtn.disabled = true;
                analyzeBtn.innerHTML = '<i data-feather="loader" class="mr-2 w-5 h-5 animate-spin"></i><span>Analyzing...</span>';
                feather.replace();
                
                resultContainer.classList.add('hidden');
                loadingIndicator.classList.remove('hidden');

                try {
                    const response = await fetch('http://localhost:5000/analyze', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            resume: resume,
                            job_description: jobDescription
                        })
                    });
                    
                    const data = await response.json();
                    
                    loadingIndicator.classList.add('hidden');
                    
                    if (data.feedback) {
                        resultContent.textContent = data.feedback;
                        resultContainer.classList.remove('hidden');
                        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else {
                        throw new Error('No feedback received');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    loadingIndicator.classList.add('hidden');
                    resultContent.innerHTML = `
                        <div class="text-red-400 bg-red-900/20 border border-red-700 rounded-lg p-4">
                            <div class="flex items-start">
                                <i data-feather="alert-circle" class="w-5 h-5 mr-3 mt-0.5 flex-shrink-0"></i>
                                <div>
                                    <p class="font-semibold mb-1">Connection Error</p>
                                    <p class="text-sm">Could not connect to the backend.</p>
                                    <p class="text-xs mt-2 text-red-300">Make sure Flask is running on http://localhost:5000</p>
                                </div>
                            </div>
                        </div>
                    `;
                    resultContainer.classList.remove('hidden');
                    feather.replace();
                } finally {
                    analyzeBtn.disabled = false;
                    analyzeBtn.innerHTML = '<i data-feather="zap" class="mr-2 w-5 h-5"></i><span>Analyze Resume</span><i data-feather="arrow-right" class="ml-2 w-5 h-5"></i>';
                    feather.replace();
                }
            });

            copyBtn.addEventListener('click', function() {
                const text = resultContent.textContent;
                navigator.clipboard.writeText(text).then(() => {
                    copyBtn.innerHTML = '<i data-feather="check" class="w-4 h-4 text-secondary-500"></i><span class="text-sm font-medium">Copied!</span>';
                    copyBtn.classList.add('bg-secondary-500', 'text-white');
                    copyBtn.classList.remove('bg-gray-700');
                    feather.replace();
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = '<i data-feather="copy" class="w-4 h-4"></i><span class="text-sm font-medium">Copy</span>';
                        copyBtn.classList.remove('bg-secondary-500', 'text-white');
                        copyBtn.classList.add('bg-gray-700');
                        feather.replace();
                    }, 2000);
                });
            });
        });
    </script>
</body>
</html>
